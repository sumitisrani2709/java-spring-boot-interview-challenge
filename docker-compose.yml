services:
  cab-booking:
    build:
      context: .
      network: host

    image: cab-booking:latest
    container_name: cab-booking

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: default
      CAB_DISPATCH_MAX_PICKUP_DISTANCE_KM: "15.0"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
