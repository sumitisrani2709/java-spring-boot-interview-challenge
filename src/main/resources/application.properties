spring.application.name=cab-booking

# --- H2 (in-memory, recreated on every start) ---------------------------------
spring.datasource.url=jdbc:h2:mem:cabbooking;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browse the data at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

# --- JPA ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Run data.sql after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Dispatch rules -----------------------------------------------------------
cab.dispatch.max-pickup-distance-km=15.0
